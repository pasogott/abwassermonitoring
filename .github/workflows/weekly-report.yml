name: Weekly Vienna Pathogen Report

on:
  schedule:
    # Every Monday at 02:00 UTC (03:00 CET / 04:00 CEST)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    # Allow manual trigger for testing

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          ignore-nothing-to-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate Vienna pathogen chart and data
        run: uv run python -m abwasser

      - name: Find generated files
        id: find-files
        run: |
          OUTPUT_DIR=$(find output -type d -name "20*" | sort -r | head -1)
          echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "chart_path=$OUTPUT_DIR/vienna_pathogens.png" >> $GITHUB_OUTPUT
          echo "data_path=$OUTPUT_DIR/vienna_data.json" >> $GITHUB_OUTPUT
          echo "Found output directory: $OUTPUT_DIR"

      - name: Send to n8n webhook (Base64 JSON)
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "Error: N8N_WEBHOOK_URL secret not set"
            exit 1
          fi

          CHART_PATH="${{ steps.find-files.outputs.chart_path }}"
          DATA_PATH="${{ steps.find-files.outputs.data_path }}"

          if [ ! -f "$CHART_PATH" ]; then
            echo "Error: Chart not found at $CHART_PATH"
            exit 1
          fi

          if [ ! -f "$DATA_PATH" ]; then
            echo "Error: Data file not found at $DATA_PATH"
            exit 1
          fi

          echo "Encoding chart as base64..."
          base64 -w0 "$CHART_PATH" > /tmp/image.b64

          echo "Building payload..."
          IMAGE_URL="https://raw.githubusercontent.com/${{ github.repository }}/development/data/latest.png"
          DATA_URL="https://raw.githubusercontent.com/${{ github.repository }}/development/data/latest.json"

          jq -n \
            --rawfile image /tmp/image.b64 \
            --arg filename "vienna_pathogens.png" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg image_url "$IMAGE_URL" \
            --arg data_url "$DATA_URL" \
            --slurpfile data "$DATA_PATH" \
            '{
              image: $image,
              filename: $filename,
              generated_at: $generated_at,
              image_url: $image_url,
              data_url: $data_url,
              data: $data[0]
            }' > /tmp/payload.json

          echo "Payload size: $(wc -c < /tmp/payload.json) bytes"

          echo "Sending to n8n webhook..."
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json \
            --fail \
            --show-error

          echo "Payload sent successfully"

      - name: Commit latest files to data folder
        run: |
          mkdir -p data
          cp "${{ steps.find-files.outputs.chart_path }}" data/latest.png
          cp "${{ steps.find-files.outputs.data_path }}" data/latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.png data/latest.json
          git commit -m "Update weekly report $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vienna-report-${{ github.run_number }}
          path: |
            ${{ steps.find-files.outputs.chart_path }}
            ${{ steps.find-files.outputs.data_path }}
          retention-days: 30
